<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mochi</title>
<style>
  :root {
    --bg: #16161a; --panel: #1e1e24; --line: #2c2c34; --side: #131317;
    --text: #e7e7ea; --muted: #8a8a93; --accent: #7c9cff; --danger: #ff7c7c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.65 "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  #banner { padding: 10px 20px; background: #3a1f1f; color: #ffd9d9;
    border-bottom: 1px solid #6b2b2b; font-size: 13px; }
  #banner[hidden] { display: none; }
  .shell { flex: 1; display: flex; min-height: 0; }

  aside { width: 248px; flex: none; background: var(--side);
    border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .tools { padding: 10px 10px 6px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tools button {
    flex: 1 1 auto; padding: 7px 10px; border-radius: 9px; font: inherit; font-size: 12px;
    border: 1px solid var(--line); background: transparent; color: #c9c9d1; cursor: pointer;
  }
  .tools button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .tools button:disabled { opacity: .4; cursor: default; }
  .tools button.danger:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }
  #days { flex: 1; overflow-y: auto; padding: 4px 8px 16px; }
  .day-row {
    display: flex; align-items: flex-start; gap: 6px;
    padding: 8px 8px; border-radius: 9px; cursor: pointer;
  }
  .day-row:hover { background: #1d1d24; }
  .day-row.active { background: #262636; }
  .day-row input { margin-top: 4px; accent-color: var(--accent); }
  .day-body { flex: 1; min-width: 0; }
  .day-title { font-size: 13px; color: #dddde4; display: flex; gap: 6px; align-items: baseline; }
  .day-title .n { color: var(--muted); font-size: 11px; }
  .day-preview { font-size: 12px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .day-x { color: var(--muted); font-size: 13px; opacity: 0; padding: 0 4px; }
  .day-row:hover .day-x { opacity: 1; }
  .day-x:hover { color: var(--danger); }
  .empty { color: var(--muted); font-size: 12px; padding: 12px 10px; }

  main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header { padding: 11px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
  header b { color: var(--text); font-weight: 600; font-size: 15px; }
  #scope { color: var(--accent); }
  #state { margin-left: auto; font-size: 12px; }

  #stream { flex: 1; overflow-y: auto; padding: 20px 20px 8px;
    display: flex; flex-direction: column; gap: 12px; }
  .day-sep { align-self: center; font-size: 11px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; margin: 6px 0; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble { max-width: min(680px, 82%); padding: 10px 14px; border-radius: 14px;
    white-space: pre-wrap; word-break: break-word; position: relative; }
  .user .bubble { background: #2f3a5c; border-bottom-right-radius: 4px; }
  .bot .bubble { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .bubble .x { position: absolute; top: -8px; right: -8px; width: 18px; height: 18px;
    border-radius: 50%; background: #2c2c34; color: var(--muted); font-size: 12px;
    line-height: 18px; text-align: center; cursor: pointer; opacity: 0; }
  .row:hover .bubble .x { opacity: 1; }
  .bubble .x:hover { background: #6b2b2b; color: #fff; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 5px; }
  .meta .tag { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; margin-right: 6px; }
  .tag.warn { color: var(--danger); border-color: #6b2b2b; }

  form { display: flex; gap: 10px; padding: 14px 20px 20px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; height: 56px; padding: 12px 14px;
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 12px; font: inherit; outline: none; }
  textarea:focus { border-color: var(--accent); }
  textarea:disabled { opacity: .5; }
  form button { padding: 0 20px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--accent); color: #0d0d12; font: inherit; font-weight: 600; cursor: pointer; }
  form button:disabled { opacity: .4; cursor: default; }
  .typing::after { content: "▍"; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (max-width: 760px) { aside { display: none; } }
</style>
</head>
<body>
<div id="banner" hidden></div>

<div class="shell">
  <aside>
    <div class="tools">
      <button id="btn-today">回到今天</button>
      <button id="btn-view" disabled>查看选中</button>
      <button id="btn-del" class="danger" disabled>删除选中</button>
    </div>
    <div id="days"></div>
  </aside>

  <main>
    <header>
      <b>Mochi</b>
      <span id="scope">今天</span>
      <span id="state">就绪</span>
    </header>

    <div id="stream"></div>

    <form id="composer">
      <textarea id="input" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）" autofocus></textarea>
      <button id="send" type="submit">发送</button>
    </form>
  </main>
</div>

<script>
const streamEl = document.getElementById("stream");
const form = document.getElementById("composer");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const stateEl = document.getElementById("state");
const scopeEl = document.getElementById("scope");
const daysEl = document.getElementById("days");
const btnToday = document.getElementById("btn-today");
const btnView = document.getElementById("btn-view");
const btnDel = document.getElementById("btn-del");

const DAY_NAMES = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
let pageId = null;

function localToday() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
let selected = new Set([localToday()]);   // 侧栏勾选的日期
let viewing = new Set(selected);           // 主区当前展示的日期

// ── 生命周期
async function hello() {
  try { const r = await fetch("/api/hello", { cache: "no-store" });
    if (r.ok) pageId = (await r.json()).page_id; } catch (_) {}
}
async function ping() {
  if (!pageId) return;
  try { await fetch("/api/ping?page=" + encodeURIComponent(pageId), { cache: "no-store" }); } catch (_) {}
}
window.addEventListener("pagehide", () => {
  if (!pageId) return;
  try { navigator.sendBeacon("/api/bye?page=" + encodeURIComponent(pageId), ""); } catch (_) {}
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) ping(); });

// ── 侧栏
function dayLabel(day) {
  const today = localToday();
  if (day === today) return "今天";
  const d = new Date(today + "T00:00:00");
  d.setDate(d.getDate() - 1);
  const y = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  if (day === y) return "昨天";
  const t = new Date(day + "T00:00:00");
  return `${day} ${DAY_NAMES[t.getDay()]}`;
}

let dayRows = [];

async function loadDays() {
  try { dayRows = await (await fetch("/api/days", { cache: "no-store" })).json(); }
  catch (_) { dayRows = []; }
  renderDays();
  updateTools();
}

function renderDays() {
  daysEl.innerHTML = "";
  const today = localToday();
  const known = new Set(dayRows.map((d) => d.day));
  const rows = [...dayRows];
  if (!known.has(today)) rows.unshift({ day: today, turns: 0, messages: 0, preview: "（今天还没开始）" });

  for (const item of rows) {
    const row = document.createElement("div");
    row.className = "day-row" + (viewing.size === 1 && viewing.has(item.day) ? " active" : "");
    row.dataset.day = item.day;

    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = selected.has(item.day);
    box.addEventListener("click", (e) => e.stopPropagation());
    box.addEventListener("change", () => {
      if (box.checked) selected.add(item.day); else selected.delete(item.day);
      updateTools();
    });

    const body = document.createElement("div");
    body.className = "day-body";
    const title = document.createElement("div");
    title.className = "day-title";
    title.textContent = dayLabel(item.day);
    if (item.turns) {
      const n = document.createElement("span");
      n.className = "n";
      n.textContent = `${item.turns} 轮`;
      title.appendChild(n);
    }
    const prev = document.createElement("div");
    prev.className = "day-preview";
    prev.textContent = item.preview || "（空）";
    body.append(title, prev);

    const x = document.createElement("div");
    x.className = "day-x";
    x.textContent = "✕";
    x.title = "删除这一天的对话";
    x.addEventListener("click", async (e) => {
      e.stopPropagation();
      await removeDays([item.day]);
    });

    row.append(box, body, x);
    row.addEventListener("click", () => {
      selected = new Set([item.day]);
      viewing = new Set([item.day]);
      renderDays();
      updateTools();
      loadHistory();
    });
    daysEl.appendChild(row);
  }
}

function updateTools() {
  btnView.disabled = selected.size === 0;
  btnDel.disabled = selected.size === 0;
  btnView.textContent = selected.size > 1 ? `查看 ${selected.size} 天` : "查看选中";
  btnDel.textContent = selected.size > 1 ? `删除 ${selected.size} 天` : "删除选中";
}

function isToday() {
  return viewing.size === 1 && viewing.has(localToday());
}

function updateScope() {
  const days = [...viewing].sort().reverse();
  scopeEl.textContent = days.length > 1
    ? `合并查看 ${days.length} 天`
    : dayLabel(days[0] || localToday());
  const canChat = isToday();
  input.disabled = !canChat;
  sendBtn.disabled = !canChat;
  input.placeholder = canChat
    ? "说点什么…（Enter 发送，Shift+Enter 换行）"
    : "正在看历史记录，点「回到今天」才能继续聊";
}

// ── 历史
function clearStream() { streamEl.innerHTML = ""; }

function addSep(text) {
  const sep = document.createElement("div");
  sep.className = "day-sep";
  sep.textContent = text;
  streamEl.appendChild(sep);
}

async function loadHistory() {
  clearStream();
  updateScope();
  const days = [...viewing].sort();
  if (!days.length) return;
  let items = [];
  try {
    items = await (await fetch("/api/history?days=" + encodeURIComponent(days.join(",")),
                               { cache: "no-store" })).json();
  } catch (_) { return; }

  let lastDay = null;
  for (const m of items) {
    if (days.length > 1 && m.day !== lastDay) { addSep(dayLabel(m.day)); lastDay = m.day; }
    if (m.role === "user") addRow("user", m.text, m.id);
    else if (m.role === "assistant") {
      const bubble = addRow("bot", m.text, m.id);
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.innerHTML = `<span class="tag">${m.at || ""}</span>`;
      bubble.after(meta);
    }
  }
  if (!items.length) {
    const empty = document.createElement("div");
    empty.className = "day-sep";
    empty.textContent = "这一天还没有对话";
    streamEl.appendChild(empty);
  }
  streamEl.scrollTop = streamEl.scrollHeight;
}

function addRow(role, text, id) {
  const row = document.createElement("div");
  row.className = "row " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  if (id) {
    const x = document.createElement("div");
    x.className = "x";
    x.textContent = "✕";
    x.title = "删除这条";
    x.addEventListener("click", () => removeMessages([id]));
    bubble.appendChild(x);
  }
  row.appendChild(bubble);
  streamEl.appendChild(row);
  streamEl.scrollTop = streamEl.scrollHeight;
  return bubble;
}

function addMeta(bubble, payload) {
  const meta = document.createElement("div");
  meta.className = "meta";
  const tags = [];
  if (payload.risk > 0) tags.push(`<span class="tag warn">风险 ${payload.risk}</span>`);
  tags.push(`<span class="tag">召回 ${payload.recall_count}</span>`);
  if (payload.lexicon_count) tags.push(`<span class="tag">语汇 ${payload.lexicon_count}</span>`);
  if (payload.cache_hit) tags.push(`<span class="tag">缓存 ${payload.cache_hit}</span>`);
  meta.innerHTML = tags.join("");
  bubble.after(meta);
}

// ── 删除
async function removeDays(days) {
  const label = days.length > 1 ? `${days.length} 天` : dayLabel(days[0]);
  if (!confirm(`删除 ${label} 的全部对话？不可恢复。`)) return;
  await postDelete({ days });
}

async function removeMessages(ids) {
  if (!confirm("删除这条消息？")) return;
  await postDelete({ message_ids: ids });
}

async function postDelete(body) {
  try {
    const res = await fetch("/api/delete", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const out = await res.json();
    if (!res.ok) throw new Error(out.error || ("HTTP " + res.status));
    stateEl.textContent = `已删除 ${out.deleted} 条`;
    if (body.days) {
      for (const d of body.days) selected.delete(d);
      viewing = new Set([...viewing].filter((d) => !body.days.includes(d)));
      if (!viewing.size) viewing = new Set([localToday()]);
    }
    await loadDays();
    await loadHistory();
  } catch (err) {
    stateEl.textContent = "删除失败";
    alert("删除失败：" + err.message);
  }
}

// ── 发送
async function send(text) {
  addRow("user", text);
  const bubble = addRow("bot", "");
  bubble.classList.add("typing");
  stateEl.textContent = "思考中…";
  sendBtn.disabled = true;

  try {
    const res = await fetch("/api/chat?page=" + encodeURIComponent(pageId || ""), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split("\n\n");
      buffer = parts.pop();

      for (const part of parts) {
        const line = part.split("\n").find((l) => l.startsWith("data: "));
        if (!line) continue;
        const event = JSON.parse(line.slice(6));
        if (event.type === "delta") {
          bubble.textContent += event.text;
          streamEl.scrollTop = streamEl.scrollHeight;
        } else if (event.type === "done") {
          bubble.classList.remove("typing");
          addMeta(bubble, event);
        } else if (event.type === "error") {
          bubble.classList.remove("typing");
          bubble.textContent = "出错了：" + event.message;
          bubble.style.color = "var(--danger)";
        }
      }
    }
    await loadDays();
  } catch (err) {
    bubble.classList.remove("typing");
    bubble.textContent = "请求失败：" + err.message;
    bubble.style.color = "var(--danger)";
  } finally {
    sendBtn.disabled = !isToday();
    stateEl.textContent = "就绪";
    input.focus();
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || !isToday()) return;
  input.value = "";
  send(text);
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

btnToday.addEventListener("click", () => {
  const today = localToday();
  selected = new Set([today]);
  viewing = new Set([today]);
  renderDays();
  updateTools();
  loadHistory();
});

btnView.addEventListener("click", () => {
  if (!selected.size) return;
  viewing = new Set(selected);
  renderDays();
  loadHistory();
});

btnDel.addEventListener("click", () => {
  if (!selected.size) return;
  removeDays([...selected]);
});

// ── 启动
const servedOverHttp = location.protocol === "http:" || location.protocol === "https:";
if (!servedOverHttp) {
  const banner = document.getElementById("banner");
  banner.hidden = false;
  banner.textContent =
    "这个页面是直接打开文件的，连不到本地服务。请先运行 " +
    "python web/server.py --port 8765，然后访问 http://127.0.0.1:8765/ 。";
  input.disabled = true;
  sendBtn.disabled = true;
} else {
  hello().then(() => {
    ping();
    setInterval(ping, 20000);
    loadDays();
    loadHistory();
  });
}
</script>
</body>
</html>
