<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mochi</title>
<style>
  :root {
    --bg: #16161a; --panel: #1e1e24; --line: #2c2c34;
    --text: #e7e7ea; --muted: #8a8a93; --accent: #7c9cff; --danger: #ff7c7c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.65 "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 12px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; color: var(--muted);
  }
  header b { color: var(--text); font-weight: 600; }
  #state { margin-left: auto; font-size: 12px; }
  #stream {
    flex: 1; overflow-y: auto; padding: 24px 20px 8px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: min(680px, 82%); padding: 10px 14px; border-radius: 14px;
    white-space: pre-wrap; word-break: break-word;
  }
  .user .bubble { background: #2f3a5c; border-bottom-right-radius: 4px; }
  .bot .bubble { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .meta .tag { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; margin-right: 6px; }
  .tag.warn { color: var(--danger); border-color: #6b2b2b; }
  form {
    display: flex; gap: 10px; padding: 14px 20px 20px; border-top: 1px solid var(--line);
  }
  textarea {
    flex: 1; resize: none; height: 56px; padding: 12px 14px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px; font: inherit; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  button {
    padding: 0 20px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--accent); color: #0d0d12; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .typing::after { content: "▍"; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<header>
  <b>Mochi</b>
  <span>本地 · 加密存储</span>
  <span id="state">就绪</span>
</header>

<div id="stream"></div>

<form id="composer">
  <textarea id="input" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）" autofocus></textarea>
  <button id="send" type="submit">发送</button>
</form>

<script>
const stream = document.getElementById("stream");
const form = document.getElementById("composer");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const stateEl = document.getElementById("state");
const sessionId = "web-" + Math.random().toString(36).slice(2, 10);

function addRow(role, text) {
  const row = document.createElement("div");
  row.className = "row " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  row.appendChild(bubble);
  stream.appendChild(row);
  stream.scrollTop = stream.scrollHeight;
  return bubble;
}

function addMeta(bubble, payload) {
  const meta = document.createElement("div");
  meta.className = "meta";
  const tags = [];
  if (payload.risk > 0) tags.push(`<span class="tag warn">风险 ${payload.risk}</span>`);
  tags.push(`<span class="tag">召回 ${payload.recall_count}</span>`);
  if (payload.lexicon_count) tags.push(`<span class="tag">语汇 ${payload.lexicon_count}</span>`);
  if (payload.cache_hit) tags.push(`<span class="tag">缓存 ${payload.cache_hit}</span>`);
  meta.innerHTML = tags.join("");
  bubble.after(meta);
}

async function send(text) {
  addRow("user", text);
  const bubble = addRow("bot", "");
  bubble.classList.add("typing");
  stateEl.textContent = "思考中…";
  sendBtn.disabled = true;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, session_id: sessionId }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split("\n\n");
      buffer = parts.pop();

      for (const part of parts) {
        const line = part.split("\n").find(l => l.startsWith("data: "));
        if (!line) continue;
        const event = JSON.parse(line.slice(6));

        if (event.type === "delta") {
          bubble.textContent += event.text;
          stream.scrollTop = stream.scrollHeight;
        } else if (event.type === "done") {
          bubble.classList.remove("typing");
          addMeta(bubble, event);
        } else if (event.type === "error") {
          bubble.classList.remove("typing");
          bubble.textContent = "出错了：" + event.message;
          bubble.style.color = "var(--danger)";
        }
      }
    }
  } catch (err) {
    bubble.classList.remove("typing");
    bubble.textContent = "请求失败：" + err.message;
    bubble.style.color = "var(--danger)";
  } finally {
    sendBtn.disabled = false;
    stateEl.textContent = "就绪";
    input.focus();
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  send(text);
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});
</script>
</body>
</html>
