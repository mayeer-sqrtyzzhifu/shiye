<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mochi</title>
<style>
  :root {
    --bg: #16161a; --panel: #1e1e24; --line: #2c2c34; --side: #131317;
    --text: #e7e7ea; --muted: #8a8a93; --accent: #7c9cff; --danger: #ff7c7c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.65 "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  #banner {
    padding: 10px 20px; background: #3a1f1f; color: #ffd9d9;
    border-bottom: 1px solid #6b2b2b; font-size: 13px; line-height: 1.7;
  }
  #banner[hidden] { display: none; }
  #banner code { background: #522a2a; padding: 1px 6px; border-radius: 4px; }
  #banner a { color: #ffd9d9; }

  .shell { flex: 1; display: flex; min-height: 0; }

  aside {
    width: 232px; flex: none; background: var(--side);
    border-right: 1px solid var(--line); display: flex; flex-direction: column;
    min-height: 0;
  }
  aside button {
    margin: 12px; padding: 9px 12px; border-radius: 10px;
    border: 1px dashed var(--line); background: transparent;
    color: var(--text); font: inherit; cursor: pointer; text-align: left;
  }
  aside button:hover { border-color: var(--accent); color: var(--accent); }
  #sessions { flex: 1; overflow-y: auto; padding: 0 8px 16px; }
  .day {
    font-size: 11px; color: var(--muted); padding: 12px 8px 4px;
    letter-spacing: .04em;
  }
  .sess {
    padding: 7px 9px; border-radius: 8px; cursor: pointer;
    font-size: 13px; color: #c9c9d1; line-height: 1.45;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sess:hover { background: #1d1d24; }
  .sess.active { background: #262636; color: #fff; }
  .sess .n { color: var(--muted); font-size: 11px; margin-left: 6px; }
  .empty { color: var(--muted); font-size: 12px; padding: 10px; }

  main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header {
    padding: 12px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; color: var(--muted);
  }
  header b { color: var(--text); font-weight: 600; }
  #state { margin-left: auto; font-size: 12px; }
  #stream {
    flex: 1; overflow-y: auto; padding: 24px 20px 8px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: min(680px, 82%); padding: 10px 14px; border-radius: 14px;
    white-space: pre-wrap; word-break: break-word;
  }
  .user .bubble { background: #2f3a5c; border-bottom-right-radius: 4px; }
  .bot .bubble { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .meta .tag { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; margin-right: 6px; }
  .tag.warn { color: var(--danger); border-color: #6b2b2b; }
  form {
    display: flex; gap: 10px; padding: 14px 20px 20px; border-top: 1px solid var(--line);
  }
  textarea {
    flex: 1; resize: none; height: 56px; padding: 12px 14px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px; font: inherit; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  form button {
    padding: 0 20px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--accent); color: #0d0d12; font: inherit; font-weight: 600; cursor: pointer;
  }
  form button:disabled { opacity: .5; cursor: default; }
  .typing::after { content: "▍"; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (max-width: 720px) { aside { display: none; } }
</style>
</head>
<body>
<div id="banner" hidden></div>

<div class="shell">
  <aside>
    <button id="new-chat">＋ 新对话</button>
    <div id="sessions"></div>
  </aside>

  <main>
    <header>
      <b>Mochi</b>
      <span>本地 · 加密存储</span>
      <span id="state">就绪</span>
    </header>

    <div id="stream"></div>

    <form id="composer">
      <textarea id="input" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）" autofocus></textarea>
      <button id="send" type="submit">发送</button>
    </form>
  </main>
</div>

<script>
const streamEl = document.getElementById("stream");
const form = document.getElementById("composer");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const stateEl = document.getElementById("state");
const sessionsEl = document.getElementById("sessions");

const SESS_KEY = "companion.session";
const DAY_NAMES = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];

let sessionId = localStorage.getItem(SESS_KEY) || null;
let pageId = null;

// ── 生命周期
async function hello() {
  try {
    const res = await fetch("/api/hello", { cache: "no-store" });
    if (res.ok) pageId = (await res.json()).page_id;
  } catch (_) {}
}
async function ping() {
  if (!pageId) return;
  try { await fetch("/api/ping?page=" + encodeURIComponent(pageId), { cache: "no-store" }); } catch (_) {}
}
window.addEventListener("pagehide", () => {
  if (!pageId) return;
  try { navigator.sendBeacon("/api/bye?page=" + encodeURIComponent(pageId), ""); } catch (_) {}
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) ping(); });

// ── 侧栏：按日期留档
function newId() {
  return "web-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function rememberSession(id) {
  sessionId = id;
  localStorage.setItem(SESS_KEY, id);
}

function dayLabel(day) {
  const today = new Date();
  const iso = (d) => d.toISOString().slice(0, 10);
  if (day === iso(today)) return "今天";
  const y = new Date(today); y.setDate(y.getDate() - 1);
  if (day === iso(y)) return "昨天";
  const d = new Date(day + "T00:00:00");
  return `${day} ${DAY_NAMES[d.getDay()]}`;
}

async function loadSessions() {
  let items = [];
  try {
    items = await (await fetch("/api/sessions", { cache: "no-store" })).json();
  } catch (_) { return; }

  sessionsEl.innerHTML = "";
  if (!items.length) {
    sessionsEl.innerHTML = '<div class="empty">还没有对话</div>';
    return;
  }

  let currentDay = null;
  for (const item of items) {
    if (item.day !== currentDay) {
      currentDay = item.day;
      const head = document.createElement("div");
      head.className = "day";
      head.textContent = dayLabel(item.day);
      sessionsEl.appendChild(head);
    }
    const row = document.createElement("div");
    row.className = "sess" + (item.session_id === sessionId ? " active" : "");
    row.dataset.session = item.session_id;
    row.title = `${item.day} ${item.time} · ${item.turns} 轮 · ${item.preview}`;
    row.textContent = (item.preview || "（空对话）");
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = item.time;
    row.appendChild(n);
    row.addEventListener("click", () => {
      rememberSession(item.session_id);
      loadHistory();
      markActive();
    });
    sessionsEl.appendChild(row);
  }
}

function markActive() {
  for (const el of sessionsEl.querySelectorAll(".sess")) {
    el.classList.toggle("active", el.dataset.session === sessionId);
  }
}

// ── 历史
function clearStream() { streamEl.innerHTML = ""; }

async function loadHistory() {
  clearStream();
  if (!sessionId) return;
  let items = [];
  try {
    items = await (await fetch("/api/history?session=" + encodeURIComponent(sessionId),
                               { cache: "no-store" })).json();
  } catch (_) { return; }
  for (const m of items) {
    if (m.role === "user") addRow("user", m.text);
    else if (m.role === "assistant") {
      const bubble = addRow("bot", m.text);
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.innerHTML = `<span class="tag">${(m.at || "").slice(11)}</span>`;
      bubble.after(meta);
    }
  }
  streamEl.scrollTop = streamEl.scrollHeight;
}

// ── 渲染
function addRow(role, text) {
  const row = document.createElement("div");
  row.className = "row " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  row.appendChild(bubble);
  streamEl.appendChild(row);
  streamEl.scrollTop = streamEl.scrollHeight;
  return bubble;
}

function addMeta(bubble, payload) {
  const meta = document.createElement("div");
  meta.className = "meta";
  const tags = [];
  if (payload.risk > 0) tags.push(`<span class="tag warn">风险 ${payload.risk}</span>`);
  tags.push(`<span class="tag">召回 ${payload.recall_count}</span>`);
  if (payload.lexicon_count) tags.push(`<span class="tag">语汇 ${payload.lexicon_count}</span>`);
  if (payload.cache_hit) tags.push(`<span class="tag">缓存 ${payload.cache_hit}</span>`);
  meta.innerHTML = tags.join("");
  bubble.after(meta);
}

// ── 发送
async function send(text) {
  if (!sessionId) rememberSession(newId());
  addRow("user", text);
  const bubble = addRow("bot", "");
  bubble.classList.add("typing");
  stateEl.textContent = "思考中…";
  sendBtn.disabled = true;

  try {
    const res = await fetch("/api/chat?page=" + encodeURIComponent(pageId || ""), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, session_id: sessionId }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split("\n\n");
      buffer = parts.pop();

      for (const part of parts) {
        const line = part.split("\n").find((l) => l.startsWith("data: "));
        if (!line) continue;
        const event = JSON.parse(line.slice(6));

        if (event.type === "delta") {
          bubble.textContent += event.text;
          streamEl.scrollTop = streamEl.scrollHeight;
        } else if (event.type === "done") {
          bubble.classList.remove("typing");
          addMeta(bubble, event);
        } else if (event.type === "error") {
          bubble.classList.remove("typing");
          bubble.textContent = "出错了：" + event.message;
          bubble.style.color = "var(--danger)";
        }
      }
    }
    loadSessions();
  } catch (err) {
    bubble.classList.remove("typing");
    bubble.textContent = "请求失败：" + err.message;
    bubble.style.color = "var(--danger)";
  } finally {
    sendBtn.disabled = false;
    stateEl.textContent = "就绪";
    input.focus();
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  send(text);
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

document.getElementById("new-chat").addEventListener("click", () => {
  rememberSession(newId());
  clearStream();
  markActive();
  loadSessions();
  input.focus();
});

// ── 启动
const servedOverHttp = location.protocol === "http:" || location.protocol === "https:";
if (!servedOverHttp) {
  const banner = document.getElementById("banner");
  banner.hidden = false;
  banner.textContent =
    "这个页面是直接打开文件的，连不到本地服务。请先运行 " +
    "python web/server.py --port 8765，然后访问 http://127.0.0.1:8765/ 。";
  sendBtn.disabled = true;
  input.disabled = true;
} else {
  hello().then(() => {
    ping();
    setInterval(ping, 20000);
    loadSessions();
    if (sessionId) loadHistory();
  });
}
</script>
</body>
</html>
